name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          # 17 is the oldest JVM the installed distribution must run on; the smoke tests launch it
          # there. Listed first so that 25, the build JVM, ends up as JAVA_HOME.
          java-version: |
            17
            25
          distribution: 'temurin'
      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
      - name: Install C++ Boost (headers + system runtime library)
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libboost-system-dev
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
